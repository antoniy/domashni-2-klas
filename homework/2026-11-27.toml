[[subject]]
title = "Български език"

  [[subject.task]]
  type = "short_answer"
  text = "Определете числото на глаголите:"
  words = ["уча", "гледат", "осветяват", "пътуват", "играя",
           "решаваме", "четем", "лекува", "летят", "редя"]

  [[subject.task]]
  type = "short_answer"
  text = "Обърнете глаголите от единствено число в множествено число."
  words = ["рисувам", "чувам", "тропам", "закачам", "седя",
           "смятам", "обличам", "звъни", "подреждам", "изваждам"]

  [[subject.task]]
  type = "copy_text"
  text = "Препишете текста. Извадете глаголите и определете числото им."
  title = "Иде вече"
  passage = [
    "Над комини и баири вече хладен вятър свири. Лястовичките в уплаха преди месец отлетяха. А пък малките врабчета скачат с босички крачета и чирикат с всички сили, сякаш първи са открили:",
    "– Скреж по клоните блести! Вятър мразовит свисти!",
    "– Лед по локвичките има! Иде вече люта зима!",
  ]
  lines = 10
  sections = [["Глаголи:", 5]]

